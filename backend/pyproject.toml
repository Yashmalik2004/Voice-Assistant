[project]
name = "voice-assistant-backend"
version = "0.1.0"
description = "Voice Assistant FastAPI backend — LiveKit token issuance, session and order APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "livekit-api>=0.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    # Database (Milestone 5)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    # RAG embeddings (Milestone 5)
    "openai>=1.50.0",
    # Rate limiting (Milestone 7)
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uvicorn]
# convenience placeholder; runs are driven from the CLI / Docker

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
