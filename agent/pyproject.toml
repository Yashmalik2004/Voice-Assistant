[project]
name = "voice-assistant-agent"
version = "0.1.0"
description = "Voice Assistant LiveKit agent worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit>=1.0.0",
    "python-dotenv>=1.0.1",
    # Full voice pipeline: Deepgram STT (M2), Silero VAD turn-taking (M4),
    # Cartesia TTS (M3), OpenAI LLM reasoning (M5).
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "livekit-plugins-cartesia>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    # HTTP client for the agent's function tools -> backend order/policy APIs.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_assistant_agent"]
